name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm64, amd64]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.mod

    - name: Tidy and build (${{ matrix.goarch }})
      working-directory: ./backend
      run: |
        go mod tidy
        GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w" -o music-dl .
        echo "Binary size: $(du -h music-dl | cut -f1)"

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: music-dl-${{ matrix.goarch }}
        path: backend/music-dl
        retention-days: 7

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Upload frontend dist
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7

  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.mod

    - name: Tidy and vet
      working-directory: ./backend
      run: |
        go mod tidy
        go vet ./...

    - name: Build
      working-directory: ./backend
      run: go build -o /dev/null .

  package-fpk:
    if: github.event_name != 'pull_request'
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.mod

    - name: Download frontend dist
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/

    - name: Embed frontend and build arm64 binary
      run: |
        rm -rf backend/api/static
        cp -r frontend/dist backend/api/static
        cd backend
        go mod tidy
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o music-dl .
        echo "Binary size: $(du -h music-dl | cut -f1)"

    - name: Assemble package
      run: |
        mkdir -p package/app/server/public
        cp backend/music-dl package/app/server/
        cp -r frontend/dist/* package/app/server/public/

    - name: Generate icons
      run: python3 scripts/generate-icons.py

    - name: Make scripts executable
      working-directory: ./package
      run: |
        chmod 755 cmd/main
        chmod 755 cmd/install_callback
        chmod 755 cmd/config_callback
        chmod 755 app/server/music-dl

    - name: Download fnpack
      run: |
        curl -sL -o /tmp/fnpack "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
        chmod +x /tmp/fnpack

    - name: Build FPK package
      run: |
        /tmp/fnpack build --directory package/
        FPK=$(find . -name "*.fpk" -maxdepth 2 | head -1)
        if [ -n "$FPK" ]; then
          mv "$FPK" music-dl.fpk
        fi
        ls -lh music-dl.fpk

    - name: Upload FPK artifact
      uses: actions/upload-artifact@v4
      with:
        name: music-dl.fpk
        path: music-dl.fpk
        retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-fpk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download FPK package
      uses: actions/download-artifact@v4
      with:
        name: music-dl-fpk
        path: music-dl-fpk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          music-dl-fpk/**
        generate_release_notes: true
